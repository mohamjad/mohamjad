<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mohamjad profile banner</title>
  <desc id="desc">Dark technical banner with evaluation systems, neural geometry, and intent drift motifs.</desc>
  <defs>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#111827" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="#020617"/>
  <rect width="1600" height="480" fill="url(#field)"/>
  <rect width="1600" height="480" fill="url(#grid)" opacity="0.7"/>

  <g opacity="0.9" filter="url(#softGlow)">
    <path d="M170 345 C310 130 480 390 620 210 C790 -5 930 410 1110 180 C1260 -12 1390 210 1460 105"
          stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <path d="M185 360 C335 195 455 405 650 250 C820 115 940 360 1095 235 C1250 110 1350 250 1455 175"
          stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <g opacity="0.82">
    <circle cx="318" cy="206" r="5" fill="#67E8F9"/>
    <circle cx="620" cy="210" r="5" fill="#67E8F9"/>
    <circle cx="1095" cy="235" r="5" fill="#A78BFA"/>
    <circle cx="1320" cy="165" r="5" fill="#67E8F9"/>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="120" y="145" fill="#E5E7EB" font-size="64" font-weight="700">mohamjad</text>
    <text x="124" y="190" fill="#94A3B8" font-size="24">evaluation systems · intent drift · neural geometry</text>

    <g font-size="18" fill="#CBD5E1">
      <text x="124" y="270">neurodrift-lab</text>
      <text x="124" y="302" fill="#64748B">riemannian drift / bci sessions / real neural fixtures</text>
      <text x="124" y="352">evalsyste-framework</text>
      <text x="124" y="384" fill="#64748B">non-verifiable evals / evidence pressure / context stability</text>
    </g>
  </g>

  <g transform="translate(1080 285)" font-family="JetBrains Mono, Consolas, monospace" font-size="16">
    <rect x="0" y="0" width="380" height="92" rx="10" fill="#020617" stroke="#334155"/>
    <text x="22" y="32" fill="#67E8F9">&gt; quality_gate</text>
    <text x="22" y="60" fill="#E5E7EB">tests: pass · lint: pass</text>
    <text x="22" y="82" fill="#94A3B8">thesis: encoded in code</text>
  </g>

  <rect x="-420" y="0" width="360" height="480" fill="url(#scan)" opacity="0.6">
    <animate attributeName="x" values="-420;1660" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
